notas: "Reforma sustancial - la propia ley ordena publicar el texto ÍNTEGRO de la Ley 977 con las reformas incorporadas Y renumerar todo el articulado. Reforma la versión consolidada por Ley 1175 (Digesto de Banca y Finanzas, Gaceta 153, 20 ago 2024). Hubo también una reforma previa: Ley N.º 1201 (26 abril 2024). El archivo [[ley-no-977-ley-contra-el-lavado-de-activos]] en este repo es la versión ORIGINAL de 2018 sin ninguna de estas reformas — no coincide con la numeración de artículos que usa esta Ley 1215."
