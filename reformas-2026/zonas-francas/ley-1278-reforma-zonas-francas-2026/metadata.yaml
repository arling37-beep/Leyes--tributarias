notas: "Reforma el numeral 1 del Art. 16, numeral 1 del Art. 20, numeral 3 del Art. 23 de la [[ley-917-ley-de-zonas-francas]], y adiciona el Art. 20 bis. Cambia el régimen de exenciones de IR y dividendos a prorrogable indefinidamente (antes tenía techo), y aclara qué pasa al concluir el plazo (Operadoras pagan 100% IR, Usuarias 40% IR). Texto oficial verbatim, no resumen de terceros."
