notas: "Reforma Art. 126 num.1, Art. 157, Art. 167 num.1, Art. 171 párrafo 1 e inciso a) num.3 de la LCT (Ley 822) - cambia base imponible de IVA/ISC a precio al distribuidor para bebidas/cigarros/jugos. Fija alícuota ISC en 0% para lista de bienes del Anexo I. Deroga numeral 3 del Art. 130. La tabla de alícuotas 0% puede estar incompleta - el usuario subió solo parte de la Gaceta 61 (páginas 3429-3472), verificar si el Anexo I tiene más partidas en el documento completo. Relevante para [[ley-987-lct-822-comparativo-2019-1-ejce-1]] (comparativo de 2019, ahora desactualizado)."
