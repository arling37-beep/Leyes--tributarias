notas: "Ley nueva - no existía previamente en el repositorio ni la Ley 265 base (Autodespacho, texto consolidado en Gaceta 72, 21 abril 2022) estaba incluida. Agrega el Art. 16 bis: exige declaración de no uso de trabajo forzado en la cadena de suministro para importaciones/admisiones. Categoría 'aduanero' es nueva en el repositorio - antes no existía esta clasificación."
