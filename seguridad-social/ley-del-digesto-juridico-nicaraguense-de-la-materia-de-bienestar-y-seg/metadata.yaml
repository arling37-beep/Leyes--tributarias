notas: 'ADVERTENCIA DE ALCANCE: en memoria previa de este proyecto se marcó "INSS
  y Ley de Seguridad Social" como fuera de alcance del repositorio. Este Digesto es
  más amplio que solo INSS (cubre bienestar social en general), pero SÍ incluye la
  materia de seguridad social. Se cataloga porque el usuario lo subió deliberadamente,
  pero se deja esta nota para que decida si lo excluye de su análisis conforme la
  regla de alcance ya establecida. Fuente: legislacion.asamblea.gob.ni, texto nativo
