notas: "Ley reciente (entró en vigor 24 mayo 2025, 90 días después de publicación). Deroga la Ley N.º 344 (Ley de Promoción de Inversiones Extranjeras, 2000) y la Ventanilla Única de Inversiones (VUI). Crea el Registro Único de Inversión Extranjera (RUIE), administrado por la Dirección de Inversiones del MIFIC."
